<!--
  The design's logo mark, on the surface colour the app renders against, so the tab
  icon does not become an invisible white glyph on a light browser chrome.
  Kept as its own file rather than imported from `src/ui/icons/assets`: the browser
  requests this before any bundle exists.
-->
