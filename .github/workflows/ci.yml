name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting `main`. Filtering by base branch
  # leaves a PR stacked on another PR with no checks at all — which is exactly
  # when a second opinion is worth most, because the diff is being reviewed
  # against a base that has not landed yet.
  pull_request:

# A new push to the same branch makes the in-flight run irrelevant, so cancel it
# rather than paying for two runs and reading the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Without this the job runs with whatever the repository default
# grants, which for a public repo is read-only today but is a setting, not a
# guarantee — and nothing here needs to write.
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, format, test, build
    runs-on: ubuntu-latest
    # A ceiling, not an estimate: the whole job runs in about four minutes, and
    # without this a step that hangs — a watch-mode flag that slipped into a
    # script, a prompt nothing answers — sits there until GitHub's six-hour
    # default gives up. Same value as the sibling `ravn-ui-kit` workflow.
    timeout-minutes: 15
    steps:
      # Pinned to the same majors as `ravn-ui-kit`'s workflow, deliberately.
      # The two repositories are built and reviewed together, and letting each
      # drift to whatever was current the day someone touched it is how you end
      # up debugging a difference between pipelines that are supposed to be the
      # same. Bump them in lockstep, in both repositories, or not at all.
      - uses: actions/checkout@v4

      # `node-version` is the one thing NOT copied from the kit, which builds on
      # 20: this app's `engines` field requires >=22.13.0, so 20 would install
      # dependencies CI could not then run.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and
      # fails if package.json and the lockfile have drifted apart, which is the
      # difference between CI proving something and CI guessing.
      - run: npm ci

      # One command rather than four, so this file and the `gate` script cannot
      # drift apart. `gate` is typecheck -> lint -> format:check -> coverage, it
      # is what CONTRIBUTING-style guidance tells a developer to run locally, and
      # inlining its steps here meant its own composition was never exercised in
      # CI — a break in the script itself would have shipped silently.
      - run: npm run gate

      # `typecheck` proves the types; only a real bundle proves it ships. A broken
      # asset import or a dependency that resolves in dev but not in a production
      # build fails nowhere else in this pipeline.
      - run: npm run build

      # A budget, not a benchmark. The entry chunk was 760 kB before the vendor
      # split in `vite.config.ts`; this fails the build if it climbs back.
      #
      # `browser-*.js` is excluded by name: it is the MSW runtime, deliberately
      # shipped so the app runs with no configuration — see the comment in
      # `src/main.tsx`. Budgeting it would either fail permanently or pressure
      # someone into removing it.
      - name: Bundle size budget
        run: |
          LIMIT=450000
          FAILED=0
          for f in dist/assets/*.js; do
            case "$(basename "$f")" in browser-*) continue ;; esac
            SIZE=$(wc -c < "$f")
            printf '%8d B  %s\n' "$SIZE" "$(basename "$f")"
            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "::error file=$f::$(basename "$f") is ${SIZE}B, over the ${LIMIT}B budget"
              FAILED=1
            fi
          done
          exit $FAILED

      # The README argues react-router was pinned because "every 7.x release falls
      # inside at least one published advisory range" — reasoning about advisories
      # in prose while never running one. This runs one.
      - run: npm audit --audit-level=high
