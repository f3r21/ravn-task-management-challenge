name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting `main`. Filtering by base branch
  # leaves a PR stacked on another PR with no checks at all — which is exactly
  # when a second opinion is worth most, because the diff is being reviewed
  # against a base that has not landed yet.
  pull_request:

# A new push to the same branch makes the in-flight run irrelevant, so cancel it
# rather than paying for two runs and reading the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Without this the job runs with whatever the repository default
# grants, which for a public repo is read-only today but is a setting, not a
# guarantee — and nothing here needs to write.
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, format, test, build
    runs-on: ubuntu-latest
    # A ceiling, not an estimate: the whole job runs in about four minutes, and
    # without this a step that hangs — a watch-mode flag that slipped into a
    # script, a prompt nothing answers — sits there until GitHub's six-hour
    # default gives up. Same value as the sibling `ravn-ui-kit` workflow.
    timeout-minutes: 15
    steps:
      # Pinned to the same majors as `ravn-ui-kit`'s workflow, deliberately.
      # The two repositories are built and reviewed together, and letting each
      # drift to whatever was current the day someone touched it is how you end
      # up debugging a difference between pipelines that are supposed to be the
      # same. Bump them in lockstep, in both repositories, or not at all.
      - uses: actions/checkout@v4

      # `node-version` is the one thing NOT copied from the kit, which builds on
      # 20: this app's `engines` field requires >=22.13.0, so 20 would install
      # dependencies CI could not then run.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and
      # fails if package.json and the lockfile have drifted apart, which is the
      # difference between CI proving something and CI guessing.
      - run: npm ci

      # One command rather than four, so this file and the `gate` script cannot
      # drift apart. `gate` is typecheck -> lint -> format:check -> coverage, it
      # is what CONTRIBUTING-style guidance tells a developer to run locally, and
      # inlining its steps here meant its own composition was never exercised in
      # CI — a break in the script itself would have shipped silently.
      - run: npm run gate

      # `typecheck` proves the types; only a real bundle proves it ships. A broken
      # asset import or a dependency that resolves in dev but not in a production
      # build fails nowhere else in this pipeline.
      - run: npm run build

      # A budget, not a benchmark. Two numbers, because one of them alone can be
      # satisfied without shipping a byte less:
      #
      # - PER_FILE catches a single chunk growing without bound. On its own it is
      #   gameable — splitting one 760 kB chunk into two 380 kB ones turns a
      #   failing build green while a cold-cache visitor downloads exactly as
      #   much. `vite.config.ts` splits chunks on purpose (for caching, and the
      #   reasoning there holds), which is precisely why this cannot be the only
      #   check.
      # - FIRST_LOAD is the number a first-time visitor actually pays: the entry
      #   script plus every chunk `index.html` preloads beside it. Read out of the
      #   HTML rather than summed over `dist/assets`, so a chunk that only exists
      #   behind a dynamic `import()` is not charged to a visitor who never opens
      #   the thing that loads it — and so a future split of the entry chunk
      #   changes where the bytes live without changing this total.
      #
      # Both count raw bytes while Vercel serves brotli, so the real transfer is
      # roughly a third of these. Raw is the right thing to ratchet on anyway: it
      # is what the browser parses and executes, and it does not move when a
      # compressor is upgraded.
      #
      # `browser-*.js` is excluded from PER_FILE by name: it is the MSW runtime,
      # deliberately shipped so the app runs with no configuration — see the
      # comment in `src/main.tsx`. Budgeting it would either fail permanently or
      # pressure someone into removing it. It is dynamically imported, so
      # FIRST_LOAD never sees it in the first place.
      #
      # Lower both when the numbers drop. Raising either is a decision, not a fix.
      - name: Bundle size budget
        run: |
          PER_FILE=250000
          FIRST_LOAD=620000
          FAILED=0
          for f in dist/assets/*.js; do
            case "$(basename "$f")" in browser-*) continue ;; esac
            SIZE=$(wc -c < "$f")
            printf '%8d B  %s\n' "$SIZE" "$(basename "$f")"
            if [ "$SIZE" -gt "$PER_FILE" ]; then
              echo "::error file=$f::$(basename "$f") is ${SIZE}B, over the ${PER_FILE}B per-file budget"
              FAILED=1
            fi
          done
          TOTAL=0
          for f in $(grep -oE '/assets/[^"]+\.js' dist/index.html | sort -u); do
            TOTAL=$((TOTAL + $(wc -c < "dist$f")))
          done
          printf '%8d B  first-load JS (entry + modulepreload)\n' "$TOTAL"
          # Zero means the HTML stopped naming its assets the way this expects,
          # not that the bundle got small. Without this the check would quietly
          # pass forever the day the build output changes shape.
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::found no first-load scripts in dist/index.html — the budget is not measuring anything"
            FAILED=1
          fi
          if [ "$TOTAL" -gt "$FIRST_LOAD" ]; then
            echo "::error::first-load JS is ${TOTAL}B, over the ${FIRST_LOAD}B budget"
            FAILED=1
          fi
          exit $FAILED

      # The README argues react-router was pinned because "every 7.x release falls
      # inside at least one published advisory range" — reasoning about advisories
      # in prose while never running one. This runs one.
      - run: npm audit --audit-level=high
